name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer virtualenv

      - name: Set Architecture (${{ matrix.arch }})
        run: |
          sed -i 's/^android.archs = .*/android.archs = ${{ matrix.arch }}/' buildozer.spec
          echo "Building dedicated APK for: ${{ matrix.arch }}"
          grep "^android.archs" buildozer.spec

      - name: Build Android Debug APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ptt-walkie-talkie-${{ matrix.arch }}-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Debug Logs on Failure (${{ matrix.arch }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-logs-${{ matrix.arch }}
          path: |
            ~/.buildozer/**/*.log
            .buildozer/**/*.log
